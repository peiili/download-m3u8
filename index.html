<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>视频资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3em;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .header .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .header .count {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 0.95em;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .search-box {
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            background: white;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #667eea;
            pointer-events: none;
        }

        .search-wrapper {
            position: relative;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            animation: fadeInUp 1s ease-out;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .video-card:active {
            transform: translateY(-4px);
        }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .video-thumbnail::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            animation: shimmer 3s infinite;
        }

        .play-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .video-card:hover .play-icon {
            background: white;
            transform: scale(1.1);
        }

        .video-info {
            padding: 20px;
        }

        .video-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            min-height: 2.8em;
        }

        .video-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
            color: #7f8c8d;
        }

        .video-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
            animation: fadeIn 1s ease-out;
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        .download-section {
            margin-top: 30px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 35px;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: white;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .download-btn::before {
            content: '📥';
            font-size: 1.3em;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 2em;
            }

            .header .subtitle {
                font-size: 1em;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .video-thumbnail {
                height: 120px;
                font-size: 2em;
            }

            .play-icon {
                width: 45px;
                height: 45px;
                font-size: 1.2em;
            }

            .video-info {
                padding: 12px;
            }

            .video-title {
                font-size: 0.95em;
                -webkit-line-clamp: 2;
                min-height: 2.6em;
            }

            .video-meta {
                font-size: 0.75em;
            }

            .search-input {
                padding: 12px 45px 12px 15px;
                font-size: 15px;
            }

            .footer {
                margin-top: 40px;
                font-size: 0.85em;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .video-card {
                display: flex;
                flex-direction: row;
                height: 120px;
            }

            .video-thumbnail {
                width: 140px;
                height: 100%;
                flex-shrink: 0;
            }

            .video-info {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .video-title {
                font-size: 1em;
            }
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: white;
            font-size: 1.2em;
            display: none;
        }

        .no-results.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 视频资源库</h1>
            <div class="subtitle">在线视频播放平台</div>
            <div class="count" id="videoCount">加载中...</div>
        </div>

        <div class="search-box">
            <div class="search-wrapper">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="搜索视频..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div class="download-section">
            <a href="/views/download" class="download-btn">
                下载新视频
            </a>
            <a href="/media-manager" class="download-btn" style="margin-left: 10px; background: rgba(255, 255, 255, 0.85);">
                📁 管理媒体库
            </a>
        </div>

        <div class="no-results" id="noResults">
            没有找到匹配的视频
        </div>

        <div class="video-grid" id="videoGrid">
            {{ul}}
        </div>

        <div class="footer">
            <p>💫 Powered by Video.js | 共享你的精彩时刻</p>
        </div>
    </div>

    <script>
        // 搜索功能
        const searchInput = document.getElementById('searchInput');
        const videoGrid = document.getElementById('videoGrid');
        const noResults = document.getElementById('noResults');
        const videoCards = videoGrid.querySelectorAll('.video-card');
        const videoCount = document.getElementById('videoCount');

        // 更新视频计数
        function updateCount() {
            const visibleCards = Array.from(videoCards).filter(card =>
                card.style.display !== 'none'
            ).length;

            if (videoCards.length === 0) {
                videoCount.textContent = '暂无视频';
            } else {
                videoCount.textContent = `共 ${visibleCards} 个视频`;
            }
        }

        // 初始化计数
        updateCount();

        // 搜索过滤
        searchInput.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            let hasResults = false;

            videoCards.forEach(card => {
                const title = card.querySelector('.video-title').textContent.toLowerCase();

                if (title.includes(searchTerm)) {
                    card.style.display = '';
                    hasResults = true;
                } else {
                    card.style.display = 'none';
                }
            });

            // 显示/隐藏无结果提示
            if (!hasResults && searchTerm !== '') {
                noResults.classList.add('show');
                videoGrid.style.display = 'none';
            } else {
                noResults.classList.remove('show');
                videoGrid.style.display = 'grid';
            }

            updateCount();
        });

        // 卡片动画
        videoCards.forEach((card, index) => {
            card.style.animationDelay = `${index * 0.05}s`;
        });

        // 键盘快捷键 - ESC清空搜索
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && searchInput.value) {
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input'));
                searchInput.blur();
            }
            // Ctrl/Cmd + K 聚焦搜索框
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // 空状态检测
        if (videoCards.length === 0) {
            videoGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📺</div>
                    <h2>暂无视频</h2>
                    <p>资源库中还没有任何视频<br>点击上方"下载新视频"按钮开始添加</p>
                </div>
            `;
            videoGrid.style.gridColumn = '1 / -1';
        }
    </script>
</body>
</html>
